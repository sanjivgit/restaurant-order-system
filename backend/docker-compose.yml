version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_db
    ports:
      - '5432:5432'
    volumes:
      - restaurant_pg_data:/var/lib/postgresql/data

volumes:
  restaurant_pg_data:
